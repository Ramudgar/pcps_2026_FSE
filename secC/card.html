<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel agency card</title>
    <style>
        *::after,
        *::before,* {
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

      #container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #0790c6;
      }
      div {
        width: 400px;
        height: 350px;
        background-color: #f3f7f9;
        border-radius: 10px;
      }

        .card img {
            width: 100%;
            height: 50%;
        
            object-fit: cover;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;

        }

        .card h2 {
            text-align: left;
            font-size: 30px;
            color: #022d51;
            margin:10px 0px;
            padding: 0px 15px;
        }
        .card p {
            text-align: left;
            font-size: 18px;
            color: #333;
            margin:10px 0px;
            padding: 0px 15px;
        }

        
      
    </style>
  </head>
  <body>
    <section id="container">
      <div class="card">
        <img
          src="https://www.exp1.com/wp-content/uploads/sites/7/2018/08/Golden-Gate-Bridge.jpg"
          alt="Golden Gate Bridge"
        />
        <h2>Golden Gate Bridge</h2>
        <p>Experience the beauty of the Golden Gate Bridge like never before.</p>

       <div class="card-footer">
          <button>Book Now</button>
          <span>$299</span>
        </div>
    </section>
  </body>
</html>
