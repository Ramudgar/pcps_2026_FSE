        .flex-item {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            font-size: 1.5em;
            text-align: center;
            border-radius: 5px;
            margin: 10px; /* Add some margin between items */
            height: 150px; /* Set a fixed height for the items */
            width: 150px; /* Set a fixed width for the items */

        }

        .flex-item:nth-child(odd) {
            background-color: #2196F3; /* Change color for odd items */
        }


   </style>
