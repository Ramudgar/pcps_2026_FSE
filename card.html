
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Premium Product Card</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Main Section */
    .main {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;

      background:
        radial-gradient(circle at top left, #dbeafe, transparent 35%),
        radial-gradient(circle at bottom right, #fce7f3, transparent 35%),
        #f8fafc;
    }

    /* Product Card */
    .card {
      width: 340px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 18px;

      box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.12),
        0 5px 15px rgba(15, 23, 42, 0.05);

      transition: 0.35s ease;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow:
        0 30px 70px rgba(15, 23, 42, 0.18),
        0 10px 25px rgba(15, 23, 42, 0.08);
    }

    /* Top section */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    /* Badge */
    .tag {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 50px;

      background: linear-gradient(135deg, #ff6b6b, #ff8e53);
      color: white;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;

      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.25);
    }

    /* Favorite button */
    .favorite {
      width: 38px;
      height: 38px;

      display: flex;
      justify-content: center;
      align-items: center;

      border: none;
      border-radius: 50%;

      background: #f8fafc;
      color: #64748b;

      font-size: 20px;
      cursor: pointer;

      transition: 0.25s;
    }

    .favorite:hover {
      background: #fee2e2;
      color: #ef4444;
      transform: scale(1.1);
    }

    /* Image container */
    .image-box {
      height: 220px;
      border-radius: 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg, #f8fafc, #e2e8f0);

      overflow: hidden;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;

      transition: 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    /* Product information */
    .product-info {
      padding: 18px 4px 10px;
    }

    .category {
      color: #6366f1;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .title {
      color: #0f172a;
      font-size: 19px;
      line-height: 1.4;
      font-weight: 700;
      margin-bottom: 9px;
    }

    /* Rating */
    .rating {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
    }

    .stars {
      color: #f59e0b;
      font-size: 15px;
    }

    .reviews {
      color: #64748b;
      font-size: 13px;
    }

    /* Price */
    .price-section {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .price {
      color: #111827;
      font-size: 25px;
      font-weight: 800;
    }

    .old-price {
      color: #94a3b8;
      font-size: 14px;
      text-decoration: line-through;
    }

    .discount {
      padding: 4px 7px;
      border-radius: 6px;

      background: #dcfce7;
      color: #15803d;

      font-size: 11px;
      font-weight: 700;
    }

    /* Shipping */
    .ship-info {
      display: flex;
      align-items: center;
      gap: 6px;

      color: #64748b;
      font-size: 13px;

      margin-bottom: 18px;
    }

    .delivery {
      color: #16a34a;
      font-weight: 700;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: 700;
      transition: 0.25s ease;
    }

    .cart-btn {
      flex: 1;
      padding: 13px;

      border: 2px solid #6366f1;
      border-radius: 12px;

      background: white;
      color: #4f46e5;
    }

    .cart-btn:hover {
      background: #eef2ff;
      transform: translateY(-2px);
    }

    .buy-btn {
      flex: 1;
      padding: 13px;

      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #4f46e5,
        #7c3aed
      );

      color: white;

      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
    }

    .buy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(79, 70, 229, 0.35);
    }

    /* Responsive */
    @media (max-width: 400px) {
      .card {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <section class="main">

    <div class="card">

      <!-- Top -->
      <div class="top">
        <p class="tag">🔥 Nearest Seller</p>

        <button class="favorite">
          ♡
        </button>
      </div>

      <!-- Product Image -->
      <div class="image-box">
        <img
          src="https://media.istockphoto.com/id/459042419/photo/red-and-black-wireless-headphones-on-a-white-background.jpg?s=612x612&w=0&k=20&c=zrKRg2Q3s6VV4cPup4MmHk7-9OHUg0Q5Ow98auUnDTI="
          alt="Wireless Headphones"
        />
      </div>

      <!-- Product Details -->
      <div class="product-info">

        <p class="category">
          Wireless Audio
        </p>

        <p class="title">
          Premium Wireless Headphones
        </p>

        <!-- Rating -->
        <div class="rating">
          <span class="stars">
            ★★★★★
          </span>

          <span class="reviews">
            4.8 (128 reviews)
          </span>
        </div>

        <!-- Price -->
        <div class="price-section">

          <span class="price">
            Rs. 1,000
          </span>

          <span class="old-price">
            Rs. 1,499
          </span>

          <span class="discount">
            33% OFF
          </span>

        </div>

        <!-- Shipping -->
        <p class="ship-info">
          🚚 Shipping: 
          <span class="delivery">
            3–5 days
          </span>
        </p>

        <!-- Buttons -->
        <div class="buttons">

          <button class="cart-btn">
            🛒 Add to Cart
          </button>

          <button class="buy-btn">
            Buy Now
          </button>

        </div>

      </div>

    </div>

  </section>

</body>
</html>
