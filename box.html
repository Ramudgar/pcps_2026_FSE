<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model in Css</title>

    <style>
        .container {
            width: 300px;
            height: 200px;
            background-color: lightblue;
            padding: 20px;
            border: 5px solid blue;
            margin:50px auto;
        }

        button {
            font-size: 16px;
            background-color: blue;
            color: white;
            border: none;
            padding:20px;
            margin: 10px;
        }

        button:hover {
            background-color: darkblue;
            cursor: pointer;
        }
    </style>

</head>
<body>
    
<div class="container">

<button>Click me</button>
<button>submit</button>

</div>

</body>
</html>
